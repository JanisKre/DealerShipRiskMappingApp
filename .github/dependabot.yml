# Dependabot, tuned for few pull requests:
# - Version updates run once a month and only offer releases that are at
#   least a week old (majors: a month), so short-lived or yanked releases
#   never show up.
# - Each ecosystem bundles everything into at most two PRs: one for
#   minor/patch updates and one for major updates. npm covers the desktop
#   app and the website together. The PR description lists every new version.
# - Security updates (enabled in the repository settings) arrive as one
#   grouped PR per ecosystem, only when an advisory affects a dependency.
#   Alerts also stay visible under Security → Dependabot.
# - @types/node follows the Node runtime (Electron's Node for the desktop
#   app, the CI Node for the website), so its majors are bumped by hand.
# Every PR runs CI (typecheck, lint, tests, build) and dependency review.
version: 2
updates:
  - package-ecosystem: npm
    directories: [/desktop-app, /website]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /training
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # Only touch requirements.txt when a range excludes the new release;
    # raising lower bounds every month is noise for a local training setup.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 2
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-all:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps-training)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-all:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
