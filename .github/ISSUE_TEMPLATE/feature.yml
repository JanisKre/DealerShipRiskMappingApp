name: Feature request
description: Suggest an improvement to the project
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed confidential dealership data, API keys, and personal data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem or workflow limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
