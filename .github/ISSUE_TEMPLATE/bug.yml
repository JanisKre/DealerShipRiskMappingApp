name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed confidential dealership data, API keys, and personal data.
          required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system
      placeholder: "macOS 15.6, Windows 11, or Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove secrets and sensitive location data before posting.
      render: shell
