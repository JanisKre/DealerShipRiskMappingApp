name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: desktop-app

env:
  # onnxruntime-node's postinstall otherwise tries to fetch optional
  # GPU/CUDA execution-provider binaries, which errors on some platforms.
  # This app only uses the bundled CPU execution provider, so skip it.
  ONNXRUNTIME_NODE_INSTALL: skip

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:coverage
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run smoke
      - run: npm audit --audit-level=high
