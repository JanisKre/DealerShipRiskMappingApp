name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: desktop-app

env:
  # onnxruntime-node's postinstall otherwise tries to fetch optional
  # GPU/CUDA execution-provider binaries, which errors on some platforms.
  # This app only uses the bundled CPU execution provider, so skip it.
  ONNXRUNTIME_NODE_INSTALL: skip

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:coverage
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run smoke
      # Playwright drives the built Electron app (no browser download
      # needed): page navigation, translations, renderer isolation and the
      # import preview, on a throw-away profile.
      - run: xvfb-run --auto-servernum npm run test:e2e
      - run: npm audit --audit-level=high
