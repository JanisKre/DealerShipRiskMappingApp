name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built artifacts to the GitHub release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Existing tag to build and publish (for example v0.2.0)"
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop-app

env:
  # onnxruntime-node's postinstall otherwise tries to fetch optional
  # GPU/CUDA execution-provider binaries, which errors on some platforms.
  # This app only uses the bundled CPU execution provider, so skip it.
  ONNXRUNTIME_NODE_INSTALL: skip
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:coverage
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run smoke
      # Same end-to-end suite as CI (navigation, translations, renderer
      # isolation, import preview, accessibility): no release without it.
      - run: xvfb-run --auto-servernum npm run test:e2e
      - run: npm audit --audit-level=high

  prepare-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Ensure one draft release exists
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft --title "Dealership Risk Mapping $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --draft --title "Dealership Risk Mapping $RELEASE_TAG" --generate-notes
          fi

  release:
    needs: [verify, prepare-release]
    permissions:
      contents: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # windows-latest currently ships a Visual Studio version node-gyp
        # doesn't recognize yet, which breaks the better-sqlite3 native
        # build; windows-2022 has a known-good, node-gyp-compatible toolchain.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run rebuild
      - run: npm run build
      # Bundle the pinned fine-tuned vehicle model (src/shared/model-release.json)
      # into the installer; fails on a missing asset or checksum mismatch.
      - run: npm run fetch:model
      - name: Build artifacts
        run: npx electron-builder --publish never
        env:
          # No signing certificates available — ship unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate release checksums
        env:
          RELEASE_PLATFORM: ${{ matrix.os }}
        run: npm run release:metadata

      - name: Generate SBOM
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.os }}
        run: npm sbom --sbom-format cyclonedx --sbom-type application > "release/SBOM-${RELEASE_PLATFORM}.cdx.json"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.os == 'macos-latest' && 'desktop-app/release/*.dmg' || 'desktop-app/release/*.exe' }}

      - name: Upload checksums and SBOM
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLATFORM: ${{ matrix.os }}
        run: gh release upload "$RELEASE_TAG" "release/SHA256SUMS-${RELEASE_PLATFORM}.txt" "release/SBOM-${RELEASE_PLATFORM}.cdx.json" --clobber

      - name: Upload platform artifacts
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.dmg.blockmap release/*.exe release/*.exe.blockmap release/latest*.yml)
          ((${#files[@]})) || { echo "No platform artifacts found" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  publish-release:
    needs: release
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: gh release edit "$RELEASE_TAG" --draft=false --title "Dealership Risk Mapping $RELEASE_TAG"
