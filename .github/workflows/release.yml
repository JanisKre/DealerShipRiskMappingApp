name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built artifacts to the GitHub release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop-app

env:
  # onnxruntime-node's postinstall otherwise tries to fetch optional
  # GPU/CUDA execution-provider binaries, which errors on some platforms.
  # This app only uses the bundled CPU execution provider, so skip it.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:coverage
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run smoke
      - run: npm audit --audit-level=high

  release:
    needs: verify
    permissions:
      contents: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # windows-latest currently ships a Visual Studio version node-gyp
        # doesn't recognize yet, which breaks the better-sqlite3 native
        # build; windows-2022 has a known-good, node-gyp-compatible toolchain.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm run rebuild
      - run: npm run build
      - name: Build and publish
        if: github.event_name == 'push' || inputs.publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certificates available — ship unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build without publishing
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: npx electron-builder --publish never

      - name: Generate release checksums
        env:
          RELEASE_PLATFORM: ${{ matrix.os }}
        run: npm run release:metadata

      - name: Generate SBOM
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.os }}
        run: npm sbom --sbom-format cyclonedx --sbom-type application > "release/SBOM-${RELEASE_PLATFORM}.cdx.json"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "desktop-app/release/*"

      - name: Upload checksums and SBOM
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLATFORM: ${{ matrix.os }}
        run: gh release upload "$GITHUB_REF_NAME" "desktop-app/release/SHA256SUMS-${RELEASE_PLATFORM}.txt" "desktop-app/release/SBOM-${RELEASE_PLATFORM}.cdx.json" --clobber
