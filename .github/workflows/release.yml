name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built artifacts to the GitHub release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop-app

env:
  # onnxruntime-node's postinstall otherwise tries to fetch optional
  # GPU/CUDA execution-provider binaries, which errors on some platforms.
  # This app only uses the bundled CPU execution provider, so skip it.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  release:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # windows-latest currently ships a Visual Studio version node-gyp
        # doesn't recognize yet, which breaks the better-sqlite3 native
        # build; windows-2022 has a known-good, node-gyp-compatible toolchain.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm run rebuild
      - run: npm run build
      - name: Build and publish
        if: github.event_name == 'push' || inputs.publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certificates available — ship unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build without publishing
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: npx electron-builder --publish never
