<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Studio</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #15171a; --panel: #1f2226; --panel-2: #262a2f; --text: #e8eaed; --muted: #9aa0a6; --line: #33373c;
    --accent: #3987e5; --good: #34c759; --warn: #ff9f0a; --bad: #ff453a; --you: #ff2d92;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line); background: rgba(21,23,26,.94); backdrop-filter: blur(6px); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .muted { font-size: 12px; }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; }
  @media (max-width: 1050px) { main { grid-template-columns: 1fr; } aside { position: static !important; } }
  .muted { color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .hero { border-color: #3b4e6b; background: linear-gradient(135deg, #1f2a3a, var(--panel)); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .hero .what { flex: 1 1 320px; }
  .hero .what b { font-size: 17px; display: block; margin-bottom: 2px; }
  .steps { display: grid; gap: 12px; margin-top: 14px; }
  .step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 650; font-size: 13px; color: var(--muted); background: var(--bg); }
  .step.done .dot { border-color: var(--good); color: var(--good); }
  .step.you .dot { border-color: var(--you); color: var(--you); }
  .step.running .dot { border-color: var(--accent); color: var(--accent); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(57,135,229,.18); } }
  .step-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
  .step-head h2 { font-size: 15px; margin: 0; font-weight: 620; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.good { color: var(--good); border-color: #2c5a37; }
  .badge.warn { color: var(--warn); border-color: #6b4a16; }
  .badge.you { color: var(--you); border-color: #6b1f45; }
  .badge.run { color: var(--accent); border-color: #234a78; }
  .badge.bad { color: var(--bad); border-color: #6b2320; }
  .facts { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 8px; }
  .fact b { display: block; font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .fact span { font-size: 12px; color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  label.opt { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  input, select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  input[type=number] { width: 80px; }
  input[type=checkbox] { accent-color: var(--accent); }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.you { background: var(--you); border-color: var(--you); color: #fff; font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .note { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .note.warn { color: var(--warn); }
  .progress { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin: 6px 0 2px; }
  .progress i { display: block; height: 100%; background: var(--you); border-radius: 99px; }
  .progress.good i { background: var(--good); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .states { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin-top: 6px; }
  .state { background: var(--panel-2); border-radius: 6px; padding: 5px 8px; font-size: 12px; }
  .state b { font-size: 13px; }
  .state .progress { height: 4px; margin: 4px 0 0; }
  .chart { position: relative; margin-top: 8px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .tip { position: absolute; pointer-events: none; background: #0f1114; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; white-space: nowrap; display: none; z-index: 3; }
  .tip b { font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 10px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .models { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; margin-top: 6px; }
  .model { background: var(--panel-2); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; }
  .model h3 { margin: 0 0 4px; font-size: 13px; }
  code, .mono { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chip { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 6px; margin-left: 4px; }
  .chip.same { background: #1d3b26; color: var(--good); }
  .chip.diff { background: #3b2c16; color: var(--warn); }
  aside { position: sticky; top: 64px; align-self: start; display: grid; gap: 12px; }
  #log { background: #0f1114; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; height: 46vh; overflow: auto; font: 11.5px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; color: #c9ccd1; margin: 8px 0 0; }
  .cmds pre { background: #0f1114; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; font: 11.5px ui-monospace, Menlo, monospace; margin: 6px 0; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #2b2f34; border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; display: none; z-index: 10; max-width: 90vw; }
  #toast.err { border-color: var(--bad); color: #ffb4ae; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Training Studio</h1>
  <span class="muted">Fahrzeugerkennung · alles bleibt auf diesem Mac</span>
  <span style="flex:1"></span>
  <span id="jobPill" class="badge">kein Job</span>
  <span id="updated" class="muted"></span>
  <button id="refresh" title="Neu laden">↻</button>
</header>

<main>
  <section>
    <div class="card hero" id="hero"><div class="what"><b>Lade Stand …</b></div></div>
    <div class="steps" id="steps"></div>
  </section>

  <aside>
    <div class="card">
      <div class="step-head"><h2 id="jobTitle">Konsole</h2><span id="jobState" class="badge">–</span></div>
      <div class="note" id="jobMeta">Hier erscheint die Ausgabe des laufenden Schritts.</div>
      <div class="row"><button id="stopJob" class="danger" disabled>Schritt abbrechen</button></div>
      <pre id="log"></pre>
    </div>
    <div class="card" id="modelCard"></div>
  </aside>
</main>
<div id="toast"></div>

<script>
const TOKEN = "__STUDIO_TOKEN__";
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
let S = null;            // last /api/status
let evalPipeline = "app-inferWindow";
const form = {};         // remembered option values across re-renders

// --- helpers --------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const fmt = (n, d = 0) => n == null ? "–" : Number(n).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n, d = 1) => n == null ? "–" : `${n > 0 ? "+" : ""}${fmt(n * 100, d)} %`;
const short = (sha) => sha ? sha.slice(0, 10) : "–";
function toast(msg, err = false) {
  const t = $("toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), err ? 7000 : 3500);
}
function runColor(name) {
  const names = (S?.runs || []).map((r) => r.name).sort();
  const i = Math.max(0, names.indexOf(name));
  return `var(${SERIES[i % SERIES.length]})`;
}
async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Studio-Token": TOKEN }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
function val(id) { const el = $(id); if (!el) return undefined; return el.type === "checkbox" ? el.checked : el.value; }
function remember() {
  document.querySelectorAll("[data-keep]").forEach((el) => { form[el.id] = el.type === "checkbox" ? el.checked : el.value; });
}
function restore() {
  document.querySelectorAll("[data-keep]").forEach((el) => {
    if (!(el.id in form)) return;
    if (el.type === "checkbox") el.checked = form[el.id]; else if ([...(el.options || [])].some((o) => o.value === form[el.id]) || el.tagName === "INPUT") el.value = form[el.id];
  });
}
function options(list, selected) { return list.map((v) => `<option value="${esc(v)}" ${v === selected ? "selected" : ""}>${esc(v)}</option>`).join(""); }
const busy = () => S?.job?.status === "running";

async function run(step, opts, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  try {
    await post("/api/run", { step, options: opts });
    toast("Gestartet – die Ausgabe steht rechts in der Konsole.");
    await loadStatus(); pollJob();
  } catch (e) { toast(e.message, true); }
}

// --- charts ---------------------------------------------------------------------
/**
 * Line chart: series = [{name, color, points:[[x,y],...]}]. One y-axis, recessive grid,
 * 2px lines, direct labels at the line end, crosshair + tooltip on hover.
 */
function lineChart(el, series, { xLabel, yFmt, xFmt, yMin, yMax, height = 220, markBest } = {}) {
  const W = 640, H = height, L = 46, R = 96, T = 10, B = 30;
  const all = series.flatMap((s) => s.points);
  if (!all.length) { el.innerHTML = `<p class="note">Noch keine Daten.</p>`; return; }
  const xs = all.map((p) => p[0]), ys = all.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1;
  let y0 = yMin ?? Math.min(...ys), y1 = yMax ?? Math.max(...ys);
  if (y1 === y0) { y1 += 1; y0 -= 1; }
  const pad = (y1 - y0) * 0.08; if (yMin == null) y0 -= pad; if (yMax == null) y1 += pad;
  const sx = (x) => L + ((x - x0) / ((x1 - x0) || 1)) * (W - L - R);
  const sy = (y) => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const ticks = 4, grid = [];
  for (let i = 0; i <= ticks; i++) {
    const y = y0 + ((y1 - y0) * i) / ticks;
    grid.push(`<line x1="${L}" x2="${W - R}" y1="${sy(y)}" y2="${sy(y)}" stroke="#2c3035" stroke-width="1"/><text x="${L - 6}" y="${sy(y) + 4}" text-anchor="end" font-size="11" fill="#9aa0a6">${esc(yFmt ? yFmt(y) : fmt(y, 2))}</text>`);
  }
  const uniqX = [...new Set(xs)].sort((a, b) => a - b);
  const step = Math.max(1, Math.ceil(uniqX.length / 8));
  const xt = uniqX.filter((_, i) => i % step === 0).map((x) => `<text x="${sx(x)}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="#9aa0a6">${esc(xFmt ? xFmt(x) : x)}</text>`);
  // Direct labels at the line ends, nudged apart so they never overlap.
  const ends = series.map((s, i) => ({ i, y: sy(s.points[s.points.length - 1][1]) })).sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 13) ends[k].y = ends[k - 1].y + 13;
  const labelY = new Map(ends.map((e) => [e.i, e.y]));
  const lines = series.map((s, si) => {
    const d = s.points.map((p, i) => `${i ? "L" : "M"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join("");
    const last = s.points[s.points.length - 1];
    let best = "";
    if (markBest && s.points.length) {
      const b = s.points.reduce((a, p) => (markBest === "max" ? p[1] > a[1] : p[1] < a[1]) ? p : a);
      best = `<circle cx="${sx(b[0])}" cy="${sy(b[1])}" r="4.5" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`;
    }
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>${best}
      <text x="${sx(last[0]) + 6}" y="${labelY.get(si) + 4}" font-size="11" fill="#c9ccd1">${esc(s.label || s.name)}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(xLabel || "Diagramm")}">
    ${grid.join("")}${xt.join("")}
    <text x="${(L + W - R) / 2}" y="${H - 2}" text-anchor="middle" font-size="11" fill="#9aa0a6">${esc(xLabel || "")}</text>
    ${lines.join("")}
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#6b7076" stroke-width="1" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/>
  </svg><div class="tip"></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cross = el.querySelector(".cross");
  el.querySelector(".hit").addEventListener("mousemove", (ev) => {
    const r = svg.getBoundingClientRect(), mx = ((ev.clientX - r.left) / r.width) * W;
    const x = uniqX.reduce((a, v) => Math.abs(sx(v) - mx) < Math.abs(sx(a) - mx) ? v : a, uniqX[0]);
    cross.setAttribute("x1", sx(x)); cross.setAttribute("x2", sx(x)); cross.setAttribute("visibility", "visible");
    const rows = series.map((s) => { const p = s.points.find((q) => q[0] === x); return p ? `<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:6px"></i>${esc(s.label || s.name)}: <b>${esc(yFmt ? yFmt(p[1]) : fmt(p[1], 3))}</b></div>` : ""; }).join("");
    tip.innerHTML = `<div class="muted">${esc(xLabel)} ${esc(xFmt ? xFmt(x) : x)}</div>${rows}`;
    tip.style.display = "block";
    const px = (sx(x) / W) * r.width;
    tip.style.left = `${Math.min(px + 12, r.width - tip.offsetWidth - 4)}px`; tip.style.top = "8px";
  });
  el.querySelector(".hit").addEventListener("mouseleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });
}

// --- steps ----------------------------------------------------------------------
function badge(kind, text) { return `<span class="badge ${kind}">${esc(text)}</span>`; }
function fact(v, label) { return `<div class="fact"><b>${v}</b><span>${esc(label)}</span></div>`; }
function bar(part, total, cls = "") { const p = total ? Math.round((part / total) * 100) : 0; return `<div class="progress ${cls}"><i style="width:${p}%"></i></div>`; }

function stepCard(n, state, title, who, body) {
  const cls = { done: "done", you: "you", running: "running" }[state] || "";
  return `<div class="step ${cls}"><div class="dot">${state === "done" ? "✓" : n}</div><div class="card">
    <div class="step-head"><h2>${esc(title)}</h2>${who}</div>${body}</div></div>`;
}

function jobRunning(step) { return busy() && S.job.step === step; }

function render() {
  remember();
  const s = S.sites, rv = S.review, au = S.audit, ds = S.dataset, runs = S.runs, m = S.models;
  const weights = S.weights;
  const defaultWeights = form.alWeights || (weights.includes("dealer-obb") ? "dealer-obb" : weights[0]);
  const html = [];

  // 1 Standorte
  html.push(stepCard(1, s.tiles ? "done" : "", "Standorte und Kacheln", badge("", "automatisch"), `
    <div class="facts">${fact(fmt(s.sites), "Standorte in sites.csv")}${fact(`${fmt(s.finished)} / ${fmt(s.sites)}`, "fertig gelabelt")}${fact(`${fmt(s.checkedTiles)} / ${fmt(s.tiles)}`, "Kacheln abgehakt")}</div>
    <div class="states">${Object.entries(s.perState).map(([st, v]) => `<div class="state"><b>${esc(st)}</b> <span class="muted">${v.finished}/${v.sites}</span>${bar(v.finished, v.sites, "good")}</div>`).join("")}</div>
    <div class="row"><button id="bFetch" ${busy() ? "disabled" : ""}>Fehlende Kacheln laden</button></div>
    <p class="note">Neue Standorte wählst du im Terminal mit <code>python select_sites.py &lt;Händler-CSV&gt;</code> aus; die Händlerliste bleibt bei dir.</p>`));

  // 2 Vorlabeln
  const pseudoPick = /pseudo/.test(defaultWeights || "");
  html.push(stepCard(2, rv.tiles ? "done" : "", "Vorlabeln", badge("", "automatisch"), `
    <div class="facts">${fact(fmt(rv.tiles), "Kacheln offener Standorte")}${fact(esc(rv.weights || "–"), "vorgelabelt mit")}${fact(fmt(au.tiles), "Audit-Kacheln")}</div>
    <div class="row">
      <label class="opt">Modell <select id="alWeights" data-keep>${options(weights, defaultWeights)}</select></label>
      <label class="opt"><input type="checkbox" id="alAudit" data-keep> fertige Standorte prüfen (Audit)</label>
      <button id="bAutolabel" ${busy() ? "disabled" : ""}>Vorlabeln starten</button>
    </div>
    <p class="note ${pseudoPick ? "warn" : ""}">${pseudoPick ? "Achtung: Ein Pseudo-Label-Modell hat die offenen Standorte schon im Training gesehen und ist dort zu selbstsicher. Für neue Vorschläge besser ein Modell ohne Pseudo-Labels nehmen." : "Bisherige Antworten bleiben erhalten, solange die Box wiedergefunden wird."}</p>`));

  // 3 Claude
  html.push(stepCard(3, S.claude.answers ? "done" : "", "Claude als Zweitprüfer", badge("", "optional"), `
    <div class="facts">${fact(fmt(S.claude.sheets), "Bögen")}${fact(fmt(S.claude.answers), "beantwortet")}</div>
    <div class="row"><button id="bSheets" ${busy() ? "disabled" : ""}>Bögen für schwache Kandidaten erzeugen</button><button id="bApply" ${busy() || !S.claude.answers ? "disabled" : ""}>Antworten übernehmen</button></div>
    <p class="note">Danach Claude Code bitten: „Prüf die Sheets in training/data/claude/sheets/“. Die Bildausschnitte verlassen dabei den Rechner. Übernommen wird nur Claudes „kein Fahrzeug“ bei schwachen Kandidaten.</p>`));

  // 4 Prüfen
  const rvDone = rv.tiles && rv.doneTiles === rv.tiles;
  html.push(stepCard(4, rvDone ? "done" : rv.tiles ? "you" : "", "Vorschläge prüfen", badge("you", "du"), `
    <div class="facts">${fact(fmt(rv.questions), "offene Fragen")}${fact(`${fmt(rv.doneTiles)} / ${fmt(rv.tiles)}`, "Kacheln fertig")}${fact(fmt(rv.openSites), "offene Standorte")}</div>
    ${bar(rv.doneTiles, rv.tiles)}
    <div class="row">${S.services.label.running ? `<a href="${esc(S.services.label.url)}" target="_blank" rel="noopener"><button class="you">Prüfseite öffnen</button></a><button id="bStopReview">Prüfseite beenden</button>` : `<button class="you" id="bReview" ${rv.tiles ? "" : "disabled"}>Prüfen starten</button>`}</div>
    <p class="note">Tasten: <b>J</b> Auto · <b>L</b> großes Fahrzeug · <b>N</b> kein Fahrzeug · danach Kachel ansehen, fehlende Fahrzeuge anklicken, <b>Enter</b>. Rund ${fmt(rv.tiles ? rv.questions / Math.max(1, rv.tiles - rv.doneTiles) : 0, 1)} Fragen pro Kachel. Du kannst jederzeit aufhören, es wird pro Kachel gespeichert.</p>`));

  // 5 Audit
  const auDone = au.tiles && au.doneTiles === au.tiles;
  html.push(stepCard(5, auDone ? "done" : au.tiles ? "you" : "", "Fertige Labels gegenprüfen (Audit)", badge("you", "du"), `
    <div class="facts">${fact(fmt(au.questions), "offene Fragen")}${fact(`${fmt(au.doneTiles)} / ${fmt(au.tiles)}`, "Kacheln fertig")}</div>
    ${bar(au.doneTiles, au.tiles)}
    <div class="row">${S.services.audit.running ? `<a href="${esc(S.services.audit.url)}" target="_blank" rel="noopener"><button class="you">Audit-Seite öffnen</button></a><button id="bStopAudit">Audit-Seite beenden</button>` : `<button class="you" id="bAudit" ${au.tiles ? "" : "disabled"}>Audit starten</button>`}</div>
    <p class="note">Fragt nach Fahrzeugen, die deinen Labels fehlen, und nach Labels, die das Modell nicht bestätigt. Am besten zuerst die 11 Validierungsstandorte: an ihnen wird jedes Modell gemessen.</p>`));

  // 6 Datensatz
  html.push(stepCard(6, ds.trainTiles ? "done" : "", "Datensatz bauen", badge("", "automatisch"), `
    <div class="facts">${fact(`${fmt(ds.trainSites)} / ${fmt(ds.valSites)}`, "Standorte Train / Val")}${fact(fmt(ds.trainTiles), "Train-Kacheln")}${fact(fmt(ds.pseudoSites), "davon Pseudo-Standorte")}${fact(fmt(ds.degraded), "weichgezeichnete Kopien")}</div>
    <div class="row">
      <label class="opt"><input type="checkbox" id="dsPseudo" data-keep ${ds.pseudoSites ? "checked" : ""}> Pseudo-Labels offener Standorte</label>
      <label class="opt">Weichzeichnen <input type="number" id="dsDegrade" data-keep min="0" max="1" step="0.1" value="0.5"></label>
      <button id="bDataset" ${busy() ? "disabled" : ""}>Datensatz bauen</button>
    </div>
    <p class="note">Gebaut ${esc(ds.built || "noch nie")}. Die Validierungsstandorte bleiben stabil, damit Messungen vergleichbar bleiben.</p>`));

  // 7 Training
  const trainRun = runs.find((r) => r.state === "running");
  const resumable = runs.filter((r) => r.state === "interrupted" && r.hasLast).map((r) => r.name);
  const nextName = form.trName || `dealer-obb-r${runs.length + 1}`;
  html.push(stepCard(7, trainRun ? "running" : runs.length ? "done" : "", "Trainieren", trainRun ? badge("run", `läuft: ${trainRun.name}`) : badge("", "automatisch · GPU"), `
    <div class="chart" id="curveChart"></div>
    <div class="legend">${runs.filter((r) => r.curve.length).map((r) => `<span><i style="background:${runColor(r.name)}"></i>${esc(r.name)}</span>`).join("")}</div>
    <table style="margin-top:8px"><thead><tr><th>Lauf</th><th>Start</th><th class="num">Epoche</th><th class="num">bestes mAP50</th><th>Stand</th></tr></thead><tbody>
    ${runs.map((r) => `<tr><td><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${runColor(r.name)};margin-right:6px"></i>${esc(r.name)}</td><td class="mono">${r.model === "last.pt" ? "fortgesetzt" : esc(r.model)}</td><td class="num">${r.lastEpoch || "–"} / ${r.epochs || "–"}</td><td class="num">${r.best ? `${fmt(r.best.map50, 3)} <span class="muted">@${r.best.epoch}</span>` : "–"}</td><td>${{ finished: badge("good", "fertig"), interrupted: badge("warn", "abgebrochen"), running: badge("run", "läuft"), empty: badge("", "leer") }[r.state]}</td></tr>`).join("")}
    </tbody></table>
    <div class="row">
      <label class="opt">Name <input id="trName" data-keep value="${esc(nextName)}" style="width:150px"></label>
      <label class="opt">Start <select id="trModel" data-keep>${options(S.baseModels, "yolo11s-obb.pt")}</select></label>
      <label class="opt">Epochen <input type="number" id="trEpochs" data-keep min="1" max="300" value="60"></label>
      <label class="opt"><input type="checkbox" id="trSmoke" data-keep> Schnelltest (3 Epochen, 10 %)</label>
      <button class="primary" id="bTrain" ${busy() ? "disabled" : ""}>Training starten</button>
    </div>
    ${resumable.length ? `<div class="row"><label class="opt">Fortsetzen <select id="trResume" data-keep>${options(resumable)}</select></label><button id="bResume" ${busy() ? "disabled" : ""}>Fortsetzen</button></div>` : ""}
    <p class="note">MacBook Air M4: etwa 1,5 min pro Epoche, ein voller Lauf 1–2 h. Am Ladegerät lassen; der Mac bleibt während des Laufs wach. Das Training stoppt früh, wenn sich 15 Epochen lang nichts verbessert. Seite schließen ist kein Problem, der Lauf geht weiter.</p>`));

  // 8 Auswerten
  html.push(stepCard(8, S.evals.length ? "done" : "", "Auswerten", badge("", "automatisch"), `
    <div class="row"><span class="seg"><button data-pipe="app-inferWindow" class="${evalPipeline === "app-inferWindow" ? "on" : ""}">App-Pipeline</button><button data-pipe="ultralytics" class="${evalPipeline === "ultralytics" ? "on" : ""}">Ultralytics</button></span>
      <span class="muted" style="font-size:12px">Zählfehler je Standort (MAE) über die Konfidenzschwelle, 11 Validierungsstandorte</span></div>
    <div class="chart" id="evalChart"></div>
    <div id="evalTable"></div>
    <div class="row">
      <label class="opt">Lauf <select id="evWeights" data-keep>${options(weights, weights[weights.length - 1])}</select></label>
      <button id="bEval" ${busy() ? "disabled" : ""}>Auswerten (Ultralytics)</button>
      <button id="bErrors" ${busy() ? "disabled" : ""}>Fehleranalyse</button>
    </div>
    <details><summary>App-Pipeline messen (maßgeblich für die Schwelle im Manifest)</summary>
      <p class="note">Nach dem Export im Ordner <code>desktop-app/</code>:</p>
      <div class="cmds"><pre>DETECTION_SWEEP_MODEL=../training/export/dealer_vehicles.onnx DETECTION_SWEEP_JSON=../training/data/studio/evals/app-&lt;lauf&gt;.json npm run benchmark:detection</pre></div>
    </details>`));

  // 9 Ausliefern
  html.push(stepCard(9, m.release.onnxSha256 && m.installed && m.release.onnxSha256 === m.installed.sha256 ? "done" : "", "In die App und in den Release", badge("you", "du entscheidest"), `
    <div class="row">
      <label class="opt">Lauf <select id="exWeights" data-keep>${options(weights, weights[weights.length - 1])}</select></label>
      <label class="opt">Standard-Schwelle <input type="number" id="exConf" data-keep min="0.05" max="0.95" step="0.05" placeholder="z. B. 0.45"></label>
      <button id="bExport" ${busy() ? "disabled" : ""}>Exportieren</button>
      <button class="primary" id="bInstall" ${busy() ? "disabled" : ""}>Exportieren und in der App installieren</button>
    </div>
    <p class="note">Beim Installieren wird das bisherige Modell in <code>userData/models/backup-…</code> gesichert. Danach die App neu starten.</p>
    <div class="row"><button id="bPinExport" ${m.export ? "" : "disabled"}>Release-Modell = letzter Export</button><button id="bPinInstalled" ${m.installed ? "" : "disabled"}>Release-Modell = installiertes Modell</button></div>
    <div id="pinOut" class="cmds"></div>`));

  $("steps").innerHTML = html.join("");
  restore();
  renderHero(); renderModels(); renderCharts(); wire();
}

function renderHero() {
  const rv = S.review, au = S.audit, runs = S.runs, m = S.models;
  let title, text, btn = "";
  if (busy()) {
    title = `Läuft: ${S.job.title}`; text = "Die Ausgabe steht rechts. Du kannst die Seite schließen; der Schritt läuft weiter.";
  } else if (rv.tiles && rv.questions > 0) {
    title = `Du bist dran: ${fmt(rv.questions)} Fragen in ${fmt(rv.openSites)} Standorten prüfen`;
    text = "Das ist der Schritt, der das nächste Modell besser macht: die Bundesländer, in denen das Modell bisher schwach ist (BY, SH, SN, TH).";
    btn = S.services.label.running ? `<a href="${esc(S.services.label.url)}" target="_blank" rel="noopener"><button class="you">Prüfseite öffnen</button></a>` : `<button class="you" id="hReview">Prüfen starten</button>`;
  } else if (au.tiles && au.questions > 0) {
    title = `Du bist dran: ${fmt(au.questions)} Audit-Fragen`; text = "Fehlende oder falsche Labels in fertigen Standorten finden, zuerst auf den Validierungsstandorten.";
    btn = `<button class="you" id="hAudit">Audit starten</button>`;
  } else if (!runs.some((r) => r.state === "finished" && r.modified > (S.dataset.built || ""))) {
    title = "Datensatz bauen und trainieren"; text = "Alle Fragen sind beantwortet. Jetzt Schritt 6 und 7.";
  } else {
    title = "Auswerten und entscheiden"; text = "Neuen Lauf mit dem installierten Modell vergleichen (Schritt 8), dann exportieren (Schritt 9).";
  }
  const relOk = m.release.onnxSha256 && m.installed && m.release.onnxSha256 === m.installed.sha256;
  $("hero").innerHTML = `<div class="what"><b>${esc(title)}</b><span class="muted">${esc(text)}</span></div>${btn}
    <div class="muted" style="font-size:12px">Release-Modell: <span class="mono">${esc(m.release.tag || "–")}</span>${relOk ? ' <span class="chip same">= installiert</span>' : ""}</div>`;
  const h = $("hReview"); if (h) h.onclick = () => startReview("label");
  const a = $("hAudit"); if (a) a.onclick = () => startReview("audit");
}

function renderModels() {
  const m = S.models, rel = m.release;
  const same = (a, b) => a && b ? (a === b ? '<span class="chip same">gleich</span>' : '<span class="chip diff">anders</span>') : "";
  const card = (title, f, extra = "") => `<div class="model"><h3>${esc(title)}</h3>${f ? `
    <div>Version <b>${esc(f.version || "–")}</b>${f.defaultConfidence != null ? ` · Schwelle ${fmt(f.defaultConfidence, 2)}` : ""}</div>
    <div class="mono muted">${short(f.sha256)} ${same(f.sha256, rel.onnxSha256)}</div>
    <div class="muted">${esc((f.trainingData || []).join(", "))}</div>${extra}` : '<div class="muted">keins</div>'}</div>`;
  $("modelCard").innerHTML = `<div class="step-head"><h2>Modelle</h2></div>
    <div class="models">
      ${card("In der App installiert", m.installed, m.backups.length ? `<div class="muted">${m.backups.length} Sicherung(en)</div>` : "")}
      ${card("Letzter Export", m.export, m.export?.weights ? `<div class="muted">aus ${esc(m.export.weights)}</div>` : "")}
      <div class="model"><h3>Im Release ausgeliefert</h3><div class="mono">${esc(rel.tag || "–")}</div><div class="mono muted">${short(rel.onnxSha256)}</div><div class="muted">${esc(rel.file)}</div></div>
    </div>
    <p class="note">„gleich“ heißt: dieselbe Datei wie im Release-Pin (SHA-256).</p>`;
}

function renderCharts() {
  const curve = S.runs.filter((r) => r.curve.length).map((r) => ({ name: r.name, color: runColor(r.name), points: r.curve }));
  const c = $("curveChart");
  if (c) lineChart(c, curve, { xLabel: "Epoche", yFmt: (y) => fmt(y, 2), yMax: 1, markBest: "max" });
  const evals = S.evals.filter((e) => e.pipeline === evalPipeline);
  const byRun = new Map();
  evals.forEach((e) => { const name = e.run || runFromWeights(e.weights) || e.model; byRun.set(name, e); });   // latest per run
  const series = [...byRun.entries()].map(([name, e]) => ({ name, color: runColor(name), points: e.thresholds.map((t) => [t.conf, t.mae]) }));
  const ec = $("evalChart");
  if (ec) lineChart(ec, series, { xLabel: "Konfidenzschwelle", xFmt: (x) => fmt(x, 2), yFmt: (y) => fmt(y, 1), markBest: "min", height: 230 });
  const et = $("evalTable");
  if (et) et.innerHTML = series.length ? `<table><thead><tr><th>Lauf</th><th class="num">beste Schwelle</th><th class="num">MAE</th><th class="num">Bias</th><th class="num">≤ 10 %</th><th class="num">mAP50</th><th>gemessen</th></tr></thead><tbody>${[...byRun.entries()].map(([name, e]) => {
    const b = e.thresholds.reduce((a, t) => t.mae < a.mae ? t : a);
    return `<tr><td>${esc(name)}</td><td class="num">${fmt(b.conf, 2)}</td><td class="num">${fmt(b.mae, 1)}</td><td class="num">${pct(b.bias)}</td><td class="num">${fmt(b.within10 * 100)} %</td><td class="num">${e.map50 != null ? fmt(e.map50, 3) : "–"}</td><td class="muted">${esc((e.date || "").slice(0, 10))}</td></tr>`; }).join("")}</tbody></table>
    <p class="note">MAE = mittlere Abweichung der Fahrzeugzahl je Standort. Bias = Über- (+) oder Unterzählung insgesamt. Elf Standorte sind wenig: Unterschiede unter etwa einem Fahrzeug sind Rauschen.</p>` : "";
}
function runFromWeights(w) { const m = /runs\/([^/]+)\/weights/.exec(w || ""); return m && m[1]; }

async function startReview(mode) {
  // Open the tab synchronously (popup blockers), then point it at review.py once it runs.
  const tab = window.open("about:blank", "_blank");
  try {
    const svc = await post("/api/review/start", { mode });
    if (tab) tab.location = svc.url; else toast(`Prüfseite läuft: ${svc.url}`);
    await loadStatus();
  } catch (e) { if (tab) tab.close(); toast(e.message, true); }
}

function wire() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("bFetch", () => run("fetch", {}));
  on("bAutolabel", () => run("autolabel", { weights: val("alWeights"), audit: val("alAudit") }));
  on("bSheets", () => run("claude-sheets", {}));
  on("bApply", () => run("claude-apply", {}));
  on("bReview", () => startReview("label"));
  on("bAudit", () => startReview("audit"));
  on("bStopReview", async () => { await post("/api/review/stop", { mode: "label" }).catch((e) => toast(e.message, true)); loadStatus(); });
  on("bStopAudit", async () => { await post("/api/review/stop", { mode: "audit" }).catch((e) => toast(e.message, true)); loadStatus(); });
  on("bDataset", () => run("dataset", { pseudo: val("dsPseudo"), degrade: Number(val("dsDegrade")) }));
  on("bTrain", () => {
    const smoke = val("trSmoke");
    run("train", { name: val("trName"), model: val("trModel"), epochs: smoke ? 3 : Number(val("trEpochs")), fraction: smoke ? 0.1 : 1 },
      smoke ? null : `Training „${val("trName")}“ mit ${val("trEpochs")} Epochen starten? Das dauert etwa ${Math.round(Number(val("trEpochs")) * 1.5)} Minuten und belastet den Mac.`);
  });
  on("bResume", () => run("train", { name: val("trResume"), resume: true }));
  on("bEval", () => run("evaluate", { weights: val("evWeights") }));
  on("bErrors", () => run("errors", { weights: val("evWeights"), conf: 0.45 }));
  const exp = (install) => {
    const conf = val("exConf");
    run("export", { weights: val("exWeights"), defaultConf: conf === "" ? null : Number(conf), install },
      install ? `${val("exWeights")} exportieren und das Modell in der App ersetzen? Das bisherige wird gesichert.` : null);
  };
  on("bExport", () => exp(false));
  on("bInstall", () => exp(true));
  const pin = async (source) => {
    if (!confirm(`Release-Pin auf das ${source === "export" ? "zuletzt exportierte" : "installierte"} Modell setzen? Das ändert desktop-app/src/shared/model-release.json.`)) return;
    try {
      const out = await post("/api/release/pin", { source });
      $("pinOut").innerHTML = `<p class="note">Pin gesetzt auf <b>${esc(out.tag)}</b>. Jetzt den Release anlegen und den Pin committen (im Repository):</p>${out.commands.map((c) => `<pre>${esc(c)}</pre>`).join("")}`;
      await loadStatus();
    } catch (e) { toast(e.message, true); }
  };
  on("bPinExport", () => pin("export"));
  on("bPinInstalled", () => pin("installed"));
  document.querySelectorAll("[data-pipe]").forEach((b) => (b.onclick = () => { evalPipeline = b.dataset.pipe; renderCharts(); document.querySelectorAll("[data-pipe]").forEach((x) => x.classList.toggle("on", x === b)); }));
}

// --- job console ----------------------------------------------------------------
const STATE_TEXT = { running: ["run", "läuft"], done: ["good", "fertig"], failed: ["bad", "fehlgeschlagen"], stopped: ["warn", "abgebrochen"], lost: ["warn", "beendet (Studio neu gestartet?)"] };
function renderJob(job) {
  const [cls, text] = STATE_TEXT[job?.status] || ["", "–"];
  $("jobTitle").textContent = job ? job.title : "Konsole";
  $("jobState").className = `badge ${cls}`; $("jobState").textContent = text;
  $("jobPill").className = `badge ${cls}`; $("jobPill").textContent = job ? `${job.title}: ${text}` : "kein Job";
  $("jobMeta").textContent = job ? `Gestartet ${job.started.replace("T", " ")}${job.ended ? ` · beendet ${job.ended.slice(11)}` : ""}${job.stages?.length > 1 ? ` · Teil ${job.stage + 1}/${job.stages.length}` : ""}` : "Hier erscheint die Ausgabe des laufenden Schritts.";
  $("stopJob").disabled = job?.status !== "running";
  const log = $("log"), stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.textContent = (job?.log || []).join("\n");
  if (stick) log.scrollTop = log.scrollHeight;
}
let polling = false;
async function pollJob() {
  if (polling) return; polling = true;
  try {
    while (true) {
      const { job, services } = await (await fetch("/api/job")).json();
      const wasRunning = busy();
      S.job = job; S.services = services; renderJob(job);
      if (job?.status !== "running") { if (wasRunning) { toast(`${job.title}: ${STATE_TEXT[job.status]?.[1] || job.status}`, job.status === "failed"); await loadStatus(); } break; }
      if (job.step === "train" && Date.now() - (pollJob.lastFull || 0) > 20000) { pollJob.lastFull = Date.now(); await loadStatus(); }
      await new Promise((r) => setTimeout(r, 2000));
    }
  } finally { polling = false; }
}
$("stopJob").onclick = async () => { if (!confirm("Laufenden Schritt abbrechen? Ein Training kann später fortgesetzt werden.")) return; try { await post("/api/stop", {}); toast("Abgebrochen."); } catch (e) { toast(e.message, true); } };

async function loadStatus() {
  try {
    S = await (await fetch("/api/status")).json();
    render(); renderJob(S.job);
    $("updated").textContent = `Stand ${S.generated.slice(11, 16)}`;
    if (busy()) pollJob();
  } catch (e) { toast(`Studio nicht erreichbar: ${e.message}`, true); }
}
$("refresh").onclick = loadStatus;
loadStatus();
setInterval(() => { if (!document.hidden && !busy()) loadStatus(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadStatus(); });
</script>
</body>
</html>
